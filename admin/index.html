<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Espace privé · Noumensia</title>
<link rel="icon" href="/favicon-32.png">
<style>
@font-face{font-family:"Newsreader";src:url("/fonts/newsreader-600.woff2") format("woff2");font-weight:600}
@font-face{font-family:"IBM Plex Sans";src:url("/fonts/ibm-plex-sans-400.woff2") format("woff2");font-weight:400}
@font-face{font-family:"IBM Plex Sans";src:url("/fonts/ibm-plex-sans-500.woff2") format("woff2");font-weight:500}
@font-face{font-family:"IBM Plex Sans";src:url("/fonts/ibm-plex-sans-600.woff2") format("woff2");font-weight:600}
@font-face{font-family:"IBM Plex Mono";src:url("/fonts/ibm-plex-mono-400.woff2") format("woff2");font-weight:400}
:root{ --bg:#F1E7D3; --card:#FAF4E8; --ink:#1E2630; --mute:#5E6670; --line:#DCCDB4; --soft:#EADDC4; --accent:#7A1F2D; --accent2:#C26472; --accent-ink:#fff;
  --s1:#7A1F2D; --s2:#1E2630; --s3:#B8AF9F; --s4:#C26472; --ok:#2F6B4F; --warn:#9A5B12; }
@media (prefers-color-scheme: dark){ :root{ --bg:#161C24; --card:#1E2630; --ink:#E9D6B4; --mute:#A3A9B1; --line:#323C48; --soft:#26303C; --accent:#C26472; --accent2:#E3A2AC; --accent-ink:#161C24;
  --s1:#C26472; --s2:#E9D6B4; --s3:#6B7480; --s4:#E3A2AC; --ok:#7FC3A0; --warn:#E0A75E; } }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif; }
.wrap{ max-width:1240px; margin:0 auto; padding:20px 16px 72px; }
h1{ font-family:Newsreader,serif; font-weight:600; font-size:1.7rem; margin:0; }
h2{ font-family:Newsreader,serif; font-weight:600; font-size:1.25rem; margin:0 0 12px; }
h3{ font-size:.95rem; margin:0 0 10px; color:var(--mute); font-weight:600; }
a{ color:var(--accent); }
.top{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.sub{ color:var(--mute); margin:2px 0 0; font-size:.9rem; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; min-width:0; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.grid2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
.grid2 > .card{ margin-bottom:0; }
.stack > * + *{ margin-top:16px; }
input,select{ font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 10px; min-width:0; }
button{ font:inherit; cursor:pointer; border-radius:8px; padding:7px 13px; border:1px solid var(--line); background:transparent; color:inherit; }
button.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
button.danger{ border-color:var(--accent); color:var(--accent); }
button.small{ padding:4px 9px; font-size:.82rem; }
button:disabled{ opacity:.5; cursor:default; }
nav.tabs{ display:flex; gap:4px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; scrollbar-width:thin; }
nav.tabs a{ white-space:nowrap; text-decoration:none; color:var(--ink); padding:7px 12px; border-radius:8px; border:1px solid transparent; font-size:.92rem; }
nav.tabs a:hover{ border-color:var(--line); }
nav.tabs a.on{ background:var(--ink); color:var(--bg); }
.period{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
.period .lbl{ color:var(--mute); font-size:.88rem; }
.crumb{ font-size:.88rem; color:var(--mute); margin:-4px 0 12px; }
.crumb a{ color:var(--mute); }
.kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
.kpi{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px 13px; }
.kpi b{ display:block; font-size:1.45rem; font-variant-numeric:tabular-nums; line-height:1.2; }
.kpi span{ color:var(--mute); font-size:.82rem; }
.kpi i{ font-style:normal; font-size:.78rem; margin-left:4px; }
.up{ color:var(--ok); } .down{ color:var(--accent); } .muted{ color:var(--mute); } .ok{ color:var(--ok); } .warn{ color:var(--warn); }
.tbl-tools{ display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:8px; }
.tbl-tools .count{ color:var(--mute); font-size:.85rem; }
.tablebox{ overflow-x:auto; max-height:640px; overflow-y:auto; border-radius:8px; }
table{ width:100%; border-collapse:collapse; font-size:.9rem; }
th,td{ text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th{ color:var(--mute); font-weight:600; font-size:.8rem; position:sticky; top:0; background:var(--card); cursor:pointer; user-select:none; white-space:nowrap; z-index:1; }
th.sorted::after{ content:" ↓"; } th.sorted.asc::after{ content:" ↑"; }
td.n, th.n{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
tr.click{ cursor:pointer; } tr.click:hover td{ background:var(--soft); }
td.wrap{ word-break:break-word; max-width:420px; }
td.mono{ font-family:"IBM Plex Mono",monospace; font-size:.82rem; }
.bar{ display:inline-block; height:8px; background:var(--accent); opacity:.75; border-radius:2px; vertical-align:middle; margin-right:6px; }
.msg{ min-height:1.3em; margin:8px 0 0; font-size:.9rem; }
.hint{ font-size:.84rem; color:var(--mute); margin:8px 0 0; }
.chart{ position:relative; }
.chart svg{ display:block; width:100%; height:auto; overflow:visible; }
.chart .tip{ position:absolute; pointer-events:none; background:var(--ink); color:var(--bg); font-size:.8rem; padding:6px 8px; border-radius:6px; white-space:nowrap; transform:translate(-50%,-110%); display:none; z-index:2; }
.legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:.82rem; color:var(--mute); margin-top:6px; }
.legend span::before{ content:""; display:inline-block; width:14px; height:3px; margin-right:6px; vertical-align:middle; background:var(--c); border-top:var(--b,none); }
.funnel .step{ margin:6px 0; }
.funnel .lab{ display:flex; justify-content:space-between; font-size:.9rem; gap:10px; }
.funnel .track{ height:22px; background:var(--soft); border-radius:6px; overflow:hidden; margin-top:3px; }
.funnel .fill{ height:100%; background:var(--accent); opacity:.85; }
.heat{ display:grid; grid-template-columns:40px repeat(24,1fr); gap:2px; font-size:.7rem; color:var(--mute); }
.heat div{ aspect-ratio:1; border-radius:3px; }
.heat .h{ aspect-ratio:auto; text-align:center; }
.timeline{ list-style:none; margin:0; padding:0; }
.timeline li{ display:grid; grid-template-columns:70px 1fr; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:.9rem; }
.timeline .t{ color:var(--mute); font-variant-numeric:tabular-nums; }
.tag{ display:inline-block; font-size:.75rem; padding:1px 7px; border-radius:20px; background:var(--soft); color:var(--mute); margin-left:6px; }
.note{ border-left:3px solid var(--line); padding:4px 0 4px 10px; color:var(--mute); font-size:.85rem; margin:0 0 14px; }
[hidden]{ display:none !important; }
@media (max-width:600px){ .wrap{ padding:14px 12px 60px; } h1{ font-size:1.4rem; } .kpi b{ font-size:1.2rem; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Espace privé</h1><p class="sub">Mesure du site, LinkedIn et inscrits · noumensia.com</p></div>
    <button id="logout" type="button" hidden>Se déconnecter</button>
  </div>

  <div class="card" id="login">
    <h2>Accès</h2>
    <form class="row" id="login-form">
      <input type="password" id="token" placeholder="Jeton d'accès" autocomplete="current-password" required style="flex:1 1 240px">
      <label class="row muted" style="gap:6px"><input type="checkbox" id="remember" checked> Se souvenir sur cet appareil</label>
      <button class="primary" type="submit">Entrer</button>
    </form>
    <p class="msg" id="login-msg"></p>
  </div>

  <div id="app" hidden>
    <nav class="tabs" id="tabs">
      <a href="#/">Vue d'ensemble</a>
      <a href="#/pages">Pages</a>
      <a href="#/sources">Provenances</a>
      <a href="#/actions">Clics et actions</a>
      <a href="#/visites">Visites</a>
      <a href="#/audience">Audience</a>
      <a href="#/entonnoirs">Entonnoirs</a>
      <a href="#/linkedin">LinkedIn</a>
      <a href="#/historique">Historique Cloudflare</a>
      <a href="#/brut">Données brutes</a>
      <a href="#/inscrits">Inscrits</a>
    </nav>
    <div class="period" id="period">
      <span class="lbl">Période</span>
      <select id="preset">
        <option value="7">7 derniers jours</option>
        <option value="30" selected>30 derniers jours</option>
        <option value="90">90 derniers jours</option>
        <option value="365">12 derniers mois</option>
        <option value="tout">Depuis le début</option>
        <option value="perso">Personnalisée</option>
      </select>
      <input type="date" id="du" hidden> <input type="date" id="au" hidden>
      <button type="button" class="small" id="refresh">Actualiser</button>
    </div>
    <div id="view"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var KEY = 'nm-admin-token', PKEY = 'nm-admin-periode', DEBUT = '2026-06-01';
  var token = '';
  try { token = localStorage.getItem(KEY) || ''; } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  var V = $('view');
  var REG = (function () { try { return new Intl.DisplayNames(['fr'], { type: 'region' }); } catch (e) { return null; } })();

  // ---------- utilitaires ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function num(n, d) { if (n == null || n === '' || isNaN(n)) return '–'; return Number(n).toLocaleString('fr-FR', { maximumFractionDigits: d == null ? 0 : d }); }
  function pct(a, b) { return b ? Math.round(a / b * 1000) / 10 : 0; }
  function dur(s) { if (s == null || isNaN(s)) return '–'; s = Math.round(s); if (s < 60) return s + ' s'; var m = Math.floor(s / 60), r = s % 60; if (m < 60) return m + ' min' + (r ? ' ' + r + ' s' : ''); return Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; }
  function utc(ts) { return new Date(String(ts).replace(' ', 'T') + (String(ts).length <= 19 ? 'Z' : '')); }
  function dt(ts) { if (!ts) return ''; var d = utc(ts); return isNaN(d) ? ts : d.toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short', timeZone: 'Europe/Paris' }); }
  function dday(j) { if (!j) return ''; var d = new Date(j + 'T12:00:00Z'); return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: '2-digit' }); }
  function pays(c) { if (!c || c === '?') return 'inconnu'; try { return REG ? (REG.of(c) || c) : c; } catch (e) { return c; } }
  function iso(d) { return d.toISOString().slice(0, 10); }
  function days(du, au) { var out = [], d = new Date(du + 'T00:00:00Z'), e = new Date(au + 'T00:00:00Z'); while (d <= e && out.length < 800) { out.push(iso(d)); d.setUTCDate(d.getUTCDate() + 1); } return out; }
  function delta(a, b) { if (!b) return ''; var p = Math.round((a - b) / b * 100); return '<i class="' + (p >= 0 ? 'up' : 'down') + '">' + (p >= 0 ? '+' : '') + p + ' %</i>'; }
  function go(h) { location.hash = h; }
  function enc(s) { return encodeURIComponent(s); }

  var RES = { out_def: 'hors définition (logiciel classique)', out_terr: 'hors champ territorial', out_excl: 'hors champ par exclusion',
    out_interdit: 'pratique interdite', out_hr1: 'haut risque, voie produit (annexe I)', out_hr3: 'haut risque, voie domaine (annexe III)',
    out_derog: 'non haut risque par dérogation', out_transp: 'obligations de transparence', out_min: 'risque minimal',
    out_iaug: 'modèle à usage général', out_iaug_s: 'modèle à risque systémique' };
  function label(evt) {
    if (!evt) return '';
    if (evt === 'vue') return 'Page vue';
    if (evt === 'temps') return 'Temps passé';
    if (evt === 'defilement') return 'Défilement';
    if (evt === 'interactions') return 'Usage d\'outil (réglages modifiés)';
    if (evt === 'erreur404') return 'Page introuvable (404)';
    var i = evt.indexOf(':'), type = evt.slice(0, i), v = evt.slice(i + 1);
    if (type === 'lien') return v.charAt(0) === '/' ? 'Lien → ' + v : (v === 'mailto' ? 'Lien e-mail' : 'Lien sortant → ' + v);
    if (type === 'clic') return 'Bouton « ' + v + ' »';
    if (type === 'envoi') return 'Formulaire envoyé · ' + v;
    if (type === 'ouverture') { var p = v.split(':'); return 'Question dépliée · ' + (p.slice(1).join(':') || p[0]); }
    if (type === 'resultat') return 'Parcours terminé · ' + (RES[v] || v);
    return evt;
  }

  // ---------- période ----------
  var P = { preset: '30', du: '', au: '' };
  try { var sp = JSON.parse(localStorage.getItem(PKEY) || 'null'); if (sp && sp.preset) P = sp; } catch (e) {}
  function range() {
    var au = iso(new Date());
    if (P.preset === 'perso' && P.du && P.au) return { du: P.du, au: P.au };
    if (P.preset === 'tout') return { du: DEBUT, au: au };
    var n = parseInt(P.preset, 10) || 30, d = new Date(); d.setUTCDate(d.getUTCDate() - (n - 1));
    return { du: iso(d), au: au };
  }
  function savePeriod() { try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (e) {} }
  $('preset').value = P.preset;
  function syncPeriodUI() { var r = range(); $('du').hidden = $('au').hidden = P.preset !== 'perso'; $('du').value = r.du; $('au').value = r.au; }
  $('preset').addEventListener('change', function () { P.preset = this.value; if (P.preset === 'perso') { var r = range(); P.du = r.du; P.au = r.au; } savePeriod(); syncPeriodUI(); route(); });
  $('du').addEventListener('change', function () { P.du = this.value; savePeriod(); route(); });
  $('au').addEventListener('change', function () { P.au = this.value; savePeriod(); route(); });
  $('refresh').addEventListener('click', function () { route(); });
  syncPeriodUI();

  // ---------- API ----------
  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' }, opts.headers || {});
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (r.status === 401) { var e = new Error('auth'); e.auth = true; throw e; }
        if (!r.ok || d.ok === false) throw new Error(d.error || ('Erreur ' + r.status));
        return d;
      });
    });
  }
  function analyse(vue, extra) {
    var r = range(), qs = 'vue=' + vue + '&du=' + r.du + '&au=' + r.au;
    for (var k in (extra || {})) qs += '&' + k + '=' + enc(extra[k]);
    return api('/api/admin/analyse?' + qs);
  }
  function download(path, name) {
    return fetch(path, { headers: { 'Authorization': 'Bearer ' + token } }).then(function (r) {
      if (!r.ok) throw new Error('Erreur ' + r.status); return r.blob();
    }).then(function (b) {
      var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    });
  }
  function csvDownload(name, cols, rows) {
    var e = function (v) { v = v == null ? '' : String(v); return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var csv = '﻿' + [cols.map(function (c) { return e(c.t); }).join(';')].concat(rows.map(function (r) { return cols.map(function (c) { return e(c.raw ? c.raw(r) : r[c.k]); }).join(';'); })).join('\r\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = name + '-' + iso(new Date()) + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  }

  // ---------- composants ----------
  // table : cols = [{k, t, n (numérique), f (format html), raw (valeur pour tri/CSV), w (wrap), bar}]
  function table(el, cols, rows, opt) {
    opt = opt || {};
    var sortK = opt.sort || null, asc = false, filt = '';
    var box = document.createElement('div');
    box.innerHTML = '<div class="tbl-tools"><span class="count"></span><span class="row">' +
      (rows.length > 8 ? '<input type="search" placeholder="Filtrer…" style="width:180px">' : '') +
      '<button type="button" class="small">Exporter (CSV)</button></span></div><div class="tablebox"><table><thead></thead><tbody></tbody></table></div>';
    el.appendChild(box);
    var thead = box.querySelector('thead'), tbody = box.querySelector('tbody');
    var val = function (r, c) { return c.raw ? c.raw(r) : r[c.k]; };
    var maxBar = {}; cols.forEach(function (c) { if (c.bar) maxBar[c.k] = Math.max.apply(null, rows.map(function (r) { return +val(r, c) || 0; }).concat([1])); });
    function draw() {
      thead.innerHTML = '<tr>' + cols.map(function (c) { return '<th data-k="' + c.k + '" class="' + (c.n ? 'n ' : '') + (sortK === c.k ? 'sorted' + (asc ? ' asc' : '') : '') + '">' + esc(c.t) + '</th>'; }).join('') + '</tr>';
      var list = rows.filter(function (r) { return !filt || cols.some(function (c) { return String(val(r, c) == null ? '' : val(r, c)).toLowerCase().indexOf(filt) !== -1 || (c.k === 'evt' && label(r.evt).toLowerCase().indexOf(filt) !== -1); }); });
      if (sortK) {
        var c = cols.filter(function (x) { return x.k === sortK; })[0];
        list = list.slice().sort(function (a, b) { var x = val(a, c), y = val(b, c); if (c.n) { x = +x || 0; y = +y || 0; } else { x = String(x == null ? '' : x).toLowerCase(); y = String(y == null ? '' : y).toLowerCase(); } return (x < y ? -1 : x > y ? 1 : 0) * (asc ? 1 : -1); });
      }
      box.querySelector('.count').textContent = list.length === rows.length ? num(rows.length) + ' ligne' + (rows.length > 1 ? 's' : '') : num(list.length) + ' sur ' + num(rows.length);
      tbody.innerHTML = list.length ? list.map(function (r, i) {
        return '<tr' + (opt.click ? ' class="click" data-i="' + rows.indexOf(r) + '"' : '') + '>' + cols.map(function (c) {
          var v = val(r, c), h = c.f ? c.f(r) : (c.n ? num(v, c.d) : esc(v));
          if (c.bar) h = '<span class="bar" style="width:' + Math.max(2, Math.round((+v || 0) / maxBar[c.k] * 80)) + 'px"></span>' + h;
          return '<td class="' + (c.n ? 'n' : '') + (c.w ? ' wrap' : '') + (c.mono ? ' mono' : '') + '">' + h + '</td>';
        }).join('') + '</tr>';
      }).join('') : '<tr><td colspan="' + cols.length + '" class="muted">Rien sur cette période.</td></tr>';
    }
    thead.addEventListener('click', function (e) { var th = e.target.closest('th'); if (!th) return; var k = th.dataset.k; if (sortK === k) asc = !asc; else { sortK = k; asc = false; } draw(); });
    tbody.addEventListener('click', function (e) { var tr = e.target.closest('tr.click'); if (tr && opt.click) opt.click(rows[+tr.dataset.i]); });
    var inp = box.querySelector('input[type=search]'); if (inp) inp.addEventListener('input', function () { filt = this.value.trim().toLowerCase(); draw(); });
    box.querySelector('button').addEventListener('click', function () { csvDownload(opt.csv || 'noumensia', cols, rows); });
    draw();
  }

  // graphique en lignes : series = [{name, color, dash, values:{jour:valeur}}], x = liste de jours, marks = [{jour, label}]
  function lineChart(el, x, series, opt) {
    opt = opt || {};
    var W = 900, H = opt.h || 220, pl = 40, pr = 10, pt = 12, pb = 26;
    var all = []; series.forEach(function (s) { x.forEach(function (j) { if (s.values[j] != null) all.push(+s.values[j]); }); });
    var max = Math.max.apply(null, all.concat([1])); var nice = Math.pow(10, Math.floor(Math.log10(max))); max = Math.ceil(max / nice) * nice;
    var X = function (i) { return pl + (x.length < 2 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (x.length - 1)); };
    var Y = function (v) { return pt + (H - pt - pb) * (1 - v / max); };
    var g = '';
    for (var k = 0; k <= 4; k++) { var v = max * k / 4, y = Y(v); g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/><text x="' + (pl - 6) + '" y="' + (y + 4) + '" font-size="11" text-anchor="end" fill="var(--mute)">' + num(v) + '</text>'; }
    var step = Math.max(1, Math.ceil(x.length / 8));
    x.forEach(function (j, i) { if (i % step === 0 || i === x.length - 1) g += '<text x="' + X(i) + '" y="' + (H - 6) + '" font-size="11" text-anchor="middle" fill="var(--mute)">' + dday(j) + '</text>'; });
    (opt.marks || []).forEach(function (m) { var i = x.indexOf(m.jour); if (i < 0) return; g += '<line x1="' + X(i) + '" x2="' + X(i) + '" y1="' + pt + '" y2="' + (H - pb) + '" stroke="var(--accent2)" stroke-dasharray="3 3" stroke-width="1.2"/><circle cx="' + X(i) + '" cy="' + (pt + 4) + '" r="4" fill="var(--accent2)"><title>' + esc(m.label) + '</title></circle>'; });
    series.forEach(function (s) {
      var pts = [], bars = '';

        $('b-sent').onclick = function () { var ids = sel(); if (!ids.length) { $('ins-msg').textContent = 'Cochez d\'abord les adresses.'; return; } api('/api/admin/inscrits', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'marquer_envoye', ids: ids }) }).then(function (r) { $('ins-msg').textContent = r.modifies + ' adresse(s) marquée(s) comme prévenue(s).'; setTimeout(route, 800); }).catch(function (e) { $('ins-msg').textContent = e.message; }); };
        var armed = false;
        $('b-purge').onclick = function () { var b = this; if (!armed) { armed = true; b.textContent = 'Confirmer la suppression'; setTimeout(function () { armed = false; b.textContent = 'Supprimer de la liste du site les adresses prévenues depuis plus de 8 jours'; }, 5000); return; } armed = false; api('/api/admin/inscrits', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'supprimer_envoyes' }) }).then(function (r) { $('ins-msg').textContent = r.modifies + ' adresse(s) supprimée(s).'; setTimeout(route, 800); }).catch(function (e) { $('ins-msg').textContent = e.message; }); };
      }).catch(fail);
    }
  };

  // ---------- routeur ----------
  function route() {
    var h = (location.hash || '#/').slice(2), parts = h.split('/'), name = parts[0] || '', arg = parts.length > 1 ? decodeURIComponent(parts.slice(1).join('/')) : null;
    var tab = { page: 'pages', source: 'sources', action: 'actions', visite: 'visites', post: 'linkedin' }[name] || name;
    document.querySelectorAll('#tabs a').forEach(function (a) { a.classList.toggle('on', a.getAttribute('href') === '#/' + tab); });
    $('period').hidden = ['inscrits', 'visite', 'post'].indexOf(name) !== -1;
    (views[name] || views[''])(arg);
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  // ---------- accès ----------
  function showApp() { $('login').hidden = true; $('app').hidden = false; $('logout').hidden = false; route(); }
  function showLogin(msg) { $('app').hidden = true; $('logout').hidden = true; $('login').hidden = false; $('login-msg').textContent = msg || ''; }
  $('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    token = $('token').value.trim();
    api('/api/admin/inscrits').then(function () {
      if ($('remember').checked) { try { localStorage.setItem(KEY, token); } catch (err) {} }
      showApp();
    }).catch(function (err) { showLogin(err.auth ? 'Jeton refusé.' : err.message); });
  });
  $('logout').addEventListener('click', function () { try { localStorage.removeItem(KEY); } catch (e) {} token = ''; showLogin(''); });
  if (token) api('/api/admin/inscrits').then(showApp).catch(function (err) { showLogin(err.auth ? 'Jeton expiré ou modifié : saisissez-le à nouveau.' : err.message); });
})();
</script>
