<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" width="920" height="510" role="img" aria-labelledby="perTitle perDesc">
  <title id="perTitle">Ce que chaque estimation du coût du turnover compte réellement</title>
  <desc id="perDesc">Comparaison des six postes de coût d'un départ selon qu'ils sont retenus par les études académiques, qui aboutissent à une médiane de 21 pour cent du salaire, ou par les estimations de cabinets, qui aboutissent à 50 à 200 pour cent. Les trois premiers postes, directs et facturables, sont comptés des deux côtés. Les trois suivants, indirects, ne le sont que par les cabinets.</desc>

  <defs>
    <style>
      .h    { font-family:"IBM Plex Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;
              font-size:12.5px; fill:#A8B4C2; font-weight:600; letter-spacing:.02em; }
      .r    { font-family:"IBM Plex Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;
              font-size:14px; fill:#F2EFEA; }
      .rs   { font-family:"IBM Plex Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;
              font-size:12px; fill:#8E9AA8; }
      .tot  { font-family:"IBM Plex Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;
              font-size:19px; fill:#F2EFEA; font-weight:600; text-anchor:middle; }
      .totl { font-family:"IBM Plex Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;
              font-size:11.5px; fill:#8E9AA8; text-anchor:middle; }
      .sep  { stroke:#3A4756; stroke-width:1; }
    </style>
  </defs>

  <rect width="920" height="510" fill="#2A3440"/>

  <!-- Colonnes : libellé 30-470 | nature 470-620 | académique 620-760 | cabinets 760-895 -->
  <text class="h" x="30"  y="42">POSTE DE COÛT D'UN DÉPART</text>
  <text class="h" x="470" y="42">NATURE</text>
  <text class="h" x="690" y="42" text-anchor="middle">ÉTUDES</text>
  <text class="h" x="690" y="58" text-anchor="middle">ACADÉMIQUES</text>
  <text class="h" x="830" y="42" text-anchor="middle">ESTIMATIONS</text>
  <text class="h" x="830" y="58" text-anchor="middle">CABINETS</text>

  <line class="sep" x1="30" y1="72" x2="890" y2="72"/>

  <!-- Ligne 1 -->
  <text class="r"  x="30"  y="104">Recrutement</text>
  <text class="rs" x="30"  y="121">annonces, cabinet, temps RH</text>
  <text class="rs" x="470" y="110">Direct, facturable</text>
  <circle cx="690" cy="105" r="7" fill="#D98A95"/>
  <circle cx="830" cy="105" r="7" fill="#D98A95"/>
  <line class="sep" x1="30" y1="136" x2="890" y2="136"/>

  <!-- Ligne 2 -->
  <text class="r"  x="30"  y="168">Administratif</text>
  <text class="rs" x="30"  y="185">solde de tout compte, matériel</text>
  <text class="rs" x="470" y="174">Direct, facturable</text>
  <circle cx="690" cy="169" r="7" fill="#D98A95"/>
  <circle cx="830" cy="169" r="7" fill="#D98A95"/>
  <line class="sep" x1="30" y1="200" x2="890" y2="200"/>

  <!-- Ligne 3 -->
  <text class="r"  x="30"  y="232">Formation du remplaçant</text>
  <text class="rs" x="30"  y="249">coût externe + temps interne</text>
  <text class="rs" x="470" y="238">Direct + temps</text>
  <circle cx="690" cy="233" r="7" fill="none" stroke="#D98A95" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="830" cy="233" r="7" fill="#D98A95"/>
  <line class="sep" x1="30" y1="264" x2="890" y2="264"/>

  <!-- Ligne 4 -->
  <text class="r"  x="30"  y="296">Montée en compétence</text>
  <text class="rs" x="30"  y="313">écart de productivité</text>
  <text class="rs" x="470" y="302">Indirect, estimé</text>
  <circle cx="690" cy="297" r="7" fill="none" stroke="#5A6673" stroke-width="1.6"/>
  <circle cx="830" cy="297" r="7" fill="#D98A95"/>
  <line class="sep" x1="30" y1="328" x2="890" y2="328"/>

  <!-- Ligne 5 -->
  <text class="r"  x="30"  y="360">Surcharge de l'équipe</text>
  <text class="rs" x="30"  y="377">pendant la vacance du poste</text>
  <text class="rs" x="470" y="366">Indirect, peu mesuré</text>
  <circle cx="690" cy="361" r="7" fill="none" stroke="#5A6673" stroke-width="1.6"/>
  <circle cx="830" cy="361" r="7" fill="#D98A95"/>
  <line class="sep" x1="30" y1="392" x2="890" y2="392"/>

  <!-- Ligne 6 -->
  <text class="r"  x="30"  y="420">Savoir tacite, relations client</text>
  <text class="rs" x="470" y="426">Indirect, difficile à chiffrer</text>
  <circle cx="690" cy="421" r="7" fill="none" stroke="#5A6673" stroke-width="1.6"/>
  <circle cx="830" cy="421" r="7" fill="none" stroke="#D98A95" stroke-width="2" stroke-dasharray="3 3"/>
  <line class="sep" x1="30" y1="446" x2="890" y2="446" stroke="#4A5766"/>

  <!-- Totaux -->
  <text class="totl" x="690" y="470">MÉDIANE OBTENUE</text>
  <text class="tot"  x="690" y="494">21 %</text>
  <text class="totl" x="830" y="470">FOURCHETTE CITÉE</text>
  <text class="tot"  x="830" y="494">50 – 200 %</text>

  <!-- Légende des pastilles -->
  <g transform="translate(30 490)">
    <circle cx="6" cy="-4" r="5.5" fill="#D98A95"/>
    <text class="rs" x="18" y="0">compté</text>
    <circle cx="86" cy="-4" r="5.5" fill="none" stroke="#D98A95" stroke-width="1.8" stroke-dasharray="3 3"/>
    <text class="rs" x="98" y="0">parfois</text>
    <circle cx="160" cy="-4" r="5.5" fill="none" stroke="#5A6673" stroke-width="1.4"/>
    <text class="rs" x="172" y="0">non compté</text>
  </g>
  <text class="rs" x="30" y="470">Boushey &amp; Glynn (2012) · Gallup · SHRM</text>
</svg>
